server:
  port: ${SERVER_PORT:8081}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:1000}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}

spring:
  application:
    name: neighborhood-life
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hmdp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:hmdp_dev}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:6}
    lettuce:
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 2
        time-between-eviction-runs: 10s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.hmdp.entity

app:
  rate-limit:
    # Production defaults to 1. Benchmarks may raise all dimensions equally so the
    # limiter stays active without masking the downstream ordering implementation.
    multiplier: ${RATE_LIMIT_MULTIPLIER:1}
  rabbit:
    listener-enabled: ${RABBIT_LISTENER_ENABLED:true}
  cache:
    local-enabled: ${LOCAL_CACHE_ENABLED:true}
  seckill:
    mode: ${SECKILL_MODE:redis-mq}
    outbox-retry-ms: ${SECKILL_OUTBOX_RETRY_MS:5000}

logging:
  level:
    com.hmdp: info
