services:
  mysql:
    image: mysql:5.7.44
    environment:
      MYSQL_ROOT_PASSWORD: hmdp_dev
      MYSQL_DATABASE: hmdp
    ports:
      - "3307:3306"
    volumes:
      - ./src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/01-hmdp.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-phmdp_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.9-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hmdp
      RABBITMQ_DEFAULT_PASS: hmdp_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: hmdp_dev
      REDIS_HOST: redis
      REDIS_DATABASE: 6
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: hmdp
      RABBITMQ_PASSWORD: hmdp_dev
      SECKILL_MODE: ${SECKILL_MODE:-redis-mq}
      RABBIT_LISTENER_ENABLED: ${RABBIT_LISTENER_ENABLED:-true}
      RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m -XX:+ExitOnOutOfMemoryError"
      LOCAL_CACHE_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
